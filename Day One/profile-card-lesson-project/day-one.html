<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hassan's Profile Card</title>
  <link rel="stylesheet" href="day-one.css">
</head>
<body>
  <main class="profile-card">
    <img class="profile-photo" src="images/hassan_pic_short.jpg" alt="Hassan smiling">

    <section class="profile-info">
      <div class="name-row">
        <h1>Hassan Barrie</h1>
      </div>

      <h2>Software Developer</h2>

      <p>
        Passionate about building cool web projects and learning
        new technologies every day.
      </p>

      <nav class="social-links" aria-label="Social media links">
        <a href="#" aria-label="Facebook"><img src="images/facebook.svg" alt=""></a>
        <a href="#" aria-label="TikTok"><img src="images/tiktok.svg" alt=""></a>
        <a href="#" aria-label="GitHub"><img src="images/github.svg" alt=""></a>
        <a href="#" aria-label="Personal website"><img src="images/website.svg" alt=""></a>
      </nav>
    </section>
  </main>
</body>
</html>
