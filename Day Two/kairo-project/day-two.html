<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo Water Card</title>
  <link rel="stylesheet" href="day-two.css">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <header class="site-header" id="home">
    <div class="nav-shell">
      <a class="brand" href="#home" aria-label="Coding STEM home">
        <span class="brand-words"><strong>CODING</strong> <b>STEM</b></span>
        <span class="brand-code">{ }</span>
        <span class="brand-line"></span>
      </a>

      <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Open navigation">
      <label class="nav-toggle-label" for="nav-toggle"><span></span><span></span><span></span></label>

      <nav class="nav-links" aria-label="Primary navigation">
        <a class="active" href="#home">Home</a>
        <a href="#about">About</a>
        <!-- <a href="projects.html">Projects</a> -->
        <a href="#curriculum">Curriculum</a>
        <a href="#partners">Partners</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="button nav-button" href="projects.html">Explore Projects</a>
    </div>
  </header>

  <main class="card">
    <img class="hero-image" src="images/kairo.jpg" alt="Kairo controlling water">

    <section class="content">
      <h1>KAIRO</h1>
      <p class="type">💧 WATER</p>
      <p class="description">
        A calm and focused warrior who controls the power of water.
      </p>

      <div class="stats">
        <div>
          <span>⚔️</span>
          <p>POWER</p>
          <strong>85</strong>
        </div>

        <div>
          <span>🪽</span>
          <p>SPEED</p>
          <strong>92</strong>
        </div>

        <div>
          <span>🛡️</span>
          <p>DEFENSE</p>
          <strong>78</strong>
        </div>
      </div>

      <div class="special-move">
        <span class="move-icon">🌊</span>
        <div>
          <small>SPECIAL MOVE</small>
          <h2>TIDAL SLASH</h2>
          <p>Unleashes a powerful wave that strikes all enemies.</p>
        </div>
      </div>

      <button>ADD TO DECK</button>
    </section>
  </main>

</body>
</html>
