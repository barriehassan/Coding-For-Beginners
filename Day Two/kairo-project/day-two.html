<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo Water Card</title>
  <link rel="stylesheet" href="day-two.css">
</head>
<body>

  <main class="card">
    <img class="hero-image" src="images/kairo.jpg" alt="Kairo controlling water">

    <section class="content">
      <h1>KAIRO</h1>
      <p class="type">💧 WATER</p>
      <p class="description">
        A calm and focused warrior who controls the power of water.
      </p>

      <div class="stats">
        <div>
          <span>⚔️</span>
          <p>POWER</p>
          <strong>85</strong>
        </div>

        <div>
          <span>🪽</span>
          <p>SPEED</p>
          <strong>92</strong>
        </div>

        <div>
          <span>🛡️</span>
          <p>DEFENSE</p>
          <strong>78</strong>
        </div>
      </div>

      <div class="special-move">
        <span class="move-icon">🌊</span>
        <div>
          <small>SPECIAL MOVE</small>
          <h2>TIDAL SLASH</h2>
          <p>Unleashes a powerful wave that strikes all enemies.</p>
        </div>
      </div>

      <button>ADD TO DECK</button>
    </section>
  </main>

</body>
</html>
