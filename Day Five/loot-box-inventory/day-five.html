<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - Loot Box Inventory</title>
  <link rel="stylesheet" href="day-five.css">
  <link rel="stylesheet" href="../../style.css" />
</head>

<body>
  <header class="site-header" id="home">
    <div class="nav-shell">
      <a class="brand" href="#home" aria-label="Coding STEM home">
        <span class="brand-words"><strong>CODING</strong> <b>STEM</b></span>
        <span class="brand-code">{ }</span>
        <span class="brand-line"></span>
      </a>

      <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Open navigation">
      <label class="nav-toggle-label" for="nav-toggle"><span></span><span></span><span></span></label>

      <nav class="nav-links" aria-label="Primary navigation">
        <a class="active" href="#home">Home</a>
        <a href="#about">About</a>
        <!-- <a href="projects.html">Projects</a> -->
        <a href="#curriculum">Curriculum</a>
        <a href="#partners">Partners</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="button nav-button" href="projects.html">Explore Projects</a>
    </div>
  </header>

  <main class="game-card">
    <p class="day-label">DAY 5 PROJECT</p>
    <h1>Mystery Loot Box</h1>
    <p class="instructions">
      Open the box, collect rewards, and build your inventory.
    </p>

    <div class="chest" id="chest">🎁</div>

    <button id="openButton" class="open-button">
      Open Box
    </button>

    <section class="result-box">
      <p>You received:</p>
      <h2 id="result">Nothing yet</h2>
      <span id="rarity" class="rarity">Open a box to begin</span>
    </section>

    <div class="counter">
      Boxes Opened:
      <strong id="boxCount">0</strong>
    </div>

    <section class="inventory">
      <div class="inventory-heading">
        <h2>Your Inventory</h2>
        <button id="clearButton" class="clear-button">
          Clear Inventory
        </button>
      </div>

      <ul id="inventoryList">
        <li class="empty-message">No rewards collected yet.</li>
      </ul>
    </section>
  </main>

  <script src="day-five.js"></script>
</body>

</html>
